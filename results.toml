# A0, graph fidelity (no search): the reference graphs against Ensembl's tables (its reasons by design written by this
# package's a0_fidelity from the stored classes: docs/families/a.md, "A0")
[[run]]
family = "a"
tree = "d4c2dda"
commit = "d4c2dda25b61cf0b33b0a178bed22f745de676d6"
organisms = ["sus_scrofa", "mus_musculus", "homo_sapiens", "macaca_mulatta", "macaca_fascicularis"]
folder = "families/a/a0/d4c2dda/{organism}"
scored = ["summary.json"]
generator = "idtrack-repro family a a0_fidelity (then --resummarize)"
files = { "a0_summary.tsv" = "summary.tsv" }
# A0 checks the graph, not answers: its rows are the graph's mismatches, every row that is not `ok` (<check>.tsv.gz),
# and the counts per class of the others (the record, docs/records.md, "What each part keeps")
rows = "every row that is not ok: presence/history/transcripts/names.tsv.gz; counts per class of the others"

# ---------------- E: robustness ----------------
[[run]]
family = "e"
tree = "d4c2dda"
commit = "d4c2dda25b61cf0b33b0a178bed22f745de676d6"
