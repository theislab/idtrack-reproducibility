# The registry of the results (docs/adding.md, "Layout"): for each benchmark, tree and organism, the scored folder of
# the data root and the tables taken from it into results/<family>/<tree>/<organism>/. `index` names the tables whose
# rows go into results/index.tsv (`report`: the common report.tsv; `scores`: the harness's scores.tsv). Only the
# current scoring of each tree is named here; regenerating (`idtrack-repro results`) replaces the files.
# `scope` is `exhaustive` (default: every line of the family's sets) or `panel` (a development stage measured by the
# family's panel; docs/methods.md, "Measurement design"). `rows` says what a run keeps where it has no rows of the
# record (docs/records.md, "Checks").

# The content digests of the graphs each tree was run on (as idtrack computes them; the runs record them).
[graphs.d4c2dda]
sus_scrofa = "c1fe33f8aa64301df847edc08521dfba0cbe49b95757d4ec5b4a65e966a092a6"
mus_musculus = "a8cae22ef59bc86b99f6915080111c5d9b24da879e3c5e257d49d6263bfeba1b"
homo_sapiens = "79589a163c15d5ab20158e64653910a16a15a4bd8bd7ffad7800db8ae50b51b4"
macaca_mulatta = "dcc52e8cc707cafa06872daf65c70a2b3946f52827644537c241ada42c2f991c"
macaca_fascicularis = "466151e05e731fc0e6a7a92ac0bc786aaadce8362d55a6597cad20cfc6cb98c4"

# the graphs of snapshot 110 (family A's A8), built by d4c2dda
[graphs.d4c2dda_s110]
sus_scrofa = "50478cbfe559920f5bbe2aa975509a2bff998c9711d77afb6c5f50dab2ac455f"
homo_sapiens = "50e06366c27378cc8687e64f734e0b9b8a883408c6d9e5ba6b253c904a695c85"

# ---------------- the accuracy harness ----------------
[[run]]
family = "harness"
tree = "d4c2dda"
commit = "d4c2dda25b61cf0b33b0a178bed22f745de676d6"
organisms = ["sus_scrofa", "mus_musculus", "homo_sapiens", "macaca_mulatta", "macaca_fascicularis"]
folder = "harness/runs/d4c2dda/{organism}"
scored = ["kinds/run.json", "travel/run.json"]
generator = "idtrack-repro harness-score --merge; idtrack-repro travel-report"
files = { "kinds_scores.tsv" = "kinds/scores.tsv", "travel_scores.tsv" = "travel/scores.tsv", "travel_report.tsv" = "travel/travel_report.tsv", "travel_report.md" = "travel/travel_report.md" }
index = { "kinds_scores.tsv" = "scores", "travel_scores.tsv" = "scores" }

# ---------------- F0: the harness's sets through the common machinery ----------------
[[run]]
family = "f0"
tree = "d4c2dda"
commit = "d4c2dda25b61cf0b33b0a178bed22f745de676d6"
organisms = ["sus_scrofa", "mus_musculus", "homo_sapiens", "macaca_mulatta", "macaca_fascicularis"]
folder = "families/f0/runs/check_d4c2dda/{organism}"
generator = "idtrack-repro score --family harness; idtrack-repro causes"
files = { "report.tsv" = "report.tsv", "scores.tsv" = "scores.tsv", "causes_summary.tsv" = "causes_summary.tsv" }
index = { "report.tsv" = "report" }

[[run]]
family = "f0"
tree = "71690ab"
commit = "71690abe044f19afcc97f146d5e6c35cf4873962"
graphs = "d4c2dda"
organisms = ["sus_scrofa", "mus_musculus", "homo_sapiens", "macaca_mulatta", "macaca_fascicularis"]
folder = "families/f0/runs/check_71690ab/{organism}"
generator = "idtrack-repro score --family harness"
files = { "report.tsv" = "report.tsv", "scores.tsv" = "scores.tsv" }
index = { "report.tsv" = "report" }

# ---------------- A*: the hardest lineages ----------------
[[run]]
family = "astar"
tree = "d4c2dda"
commit = "d4c2dda25b61cf0b33b0a178bed22f745de676d6"
