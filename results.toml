folder = "families/e/runs/d4c2dda/{organism}"
scored = ["scores_now/run.json", "scores_decided/run.json"]
generator = "idtrack-repro family e score_e; idtrack-repro family e causes_e; family e det / relations_e (e7, e8)"
files = { "now_report.tsv" = "scores_now/report.tsv", "decided_report.tsv" = "scores_decided/report.tsv", "now_causes_summary.tsv" = "scores_now/causes_summary.tsv", "decided_causes_summary.tsv" = "scores_decided/causes_summary.tsv", "e_summary.tsv" = "e_summary.tsv", "e7_report.tsv" = "e7_report.tsv", "e8_report.tsv" = "e8_report.tsv" }
index = { "now_report.tsv" = "report" }

