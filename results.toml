# The registry of the results (docs/adding.md, "Layout"): for each benchmark, tree and organism, the scored folder of
# the data root and the tables taken from it into results/<family>/<tree>/<organism>/. `index` names the tables whose
# rows go into results/index.tsv (`report`: the common report.tsv; `scores`: the harness's scores.tsv). Only the
# current scoring of each tree is named here; regenerating (`idtrack-repro results`) replaces the files.
# `scope` is `exhaustive` (default: every line of the family's sets), `panel` (a development stage measured by the
# family's panel; docs/methods.md, "Measurement design") or `sets` (every line of the sets named in `sets`, the family's
# others not asked on that tree). `limits` names the builder of the run's rows of the known-limitations table where it
# is not the family's own (known_limitations.py). `rows` says what a run keeps where it has no rows of the
# record (docs/records.md, "Checks").

