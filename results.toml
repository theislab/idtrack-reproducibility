[[run]]
family = "e"
tree = "71690ab"
commit = "71690abe044f19afcc97f146d5e6c35cf4873962"
graphs = "d4c2dda"
organisms = ["web"]
folder = "families/e/runs/71690ab_web/e9"
scored = []
generator = "idtrack-repro family e web_e"
files = { "e9_report.tsv" = "report.tsv" }
# E9 compares the web service's answers with the package's: its rows are every difference (differences.jsonl); the
# lines that agree are counted per stratum in report.tsv (the record, docs/records.md, "What each part keeps")
rows = "every difference: differences.jsonl; agreeing lines counted per stratum"

