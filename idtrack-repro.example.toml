# The configuration of the benchmarks (README, "Configuration"). Copy it to `idtrack-repro.toml` (read from the working
# directory) or point IDTRACK_REPRO_CONFIG at it. Relative paths are read from this file's folder.

[data]
# The data root: every location below defaults to a folder of it (docs/data.md, "Layout").
root = "data"
# truth = "data/truth"
# harness = "data/harness"
# families = "data/families"
# corpus = "data/corpus"
# hunts = "data/hunts"
# performance = "data/performance"
# graphs = "data/graphs"
# cache = "data/cache"
# modest = "data/modest"            # the modest set's runs, one folder per tree (docs/modest.md)
# iterations = "data/iterations"    # the iterations' plans, states and reports, one folder per tree (docs/iterate.md)

# The idtrack trees the benchmarks measure: a checkout of github.com/theislab/idtrack at the commit, the Python that
# runs it (an environment with idtrack's dependencies; default: the Python running this package) and its graphs.
[trees.d4c2dda]
commit = "d4c2dda25b61cf0b33b0a178bed22f745de676d6"
source = "trees/d4c2dda"
python = "python"
[trees.d4c2dda.graphs]
sus_scrofa = "data/graphs/sus_scrofa/graph_sus_scrofa_assembly111_min56_max115_narrow.npz"
mus_musculus = "data/graphs/mus_musculus/graph_mus_musculus_assembly39_min48_max115_narrow.npz"
homo_sapiens = "data/graphs/homo_sapiens/graph_homo_sapiens_assembly38_min48_max115_narrow.npz"
macaca_mulatta = "data/graphs/macaca_mulatta/graph_macaca_mulatta_assembly10_min48_max115_narrow.npz"
macaca_fascicularis = "data/graphs/macaca_fascicularis/graph_macaca_fascicularis_assembly6_min91_max115_narrow.npz"

[trees.71690ab]
commit = "71690abe044f19afcc97f146d5e6c35cf4873962"
source = "trees/71690ab"
python = "python"
[trees.71690ab.graphs]
sus_scrofa = "data/graphs/sus_scrofa/graph_sus_scrofa_assembly111_min56_max115_narrow.npz"
mus_musculus = "data/graphs/mus_musculus/graph_mus_musculus_assembly39_min48_max115_narrow.npz"
homo_sapiens = "data/graphs/homo_sapiens/graph_homo_sapiens_assembly38_min48_max115_narrow.npz"
macaca_mulatta = "data/graphs/macaca_mulatta/graph_macaca_mulatta_assembly10_min48_max115_narrow.npz"
macaca_fascicularis = "data/graphs/macaca_fascicularis/graph_macaca_fascicularis_assembly6_min91_max115_narrow.npz"

# The iterations (`idtrack-repro iterate <tree>`, docs/iterate.md): the trees in the order they were made. A tree's
# previous iteration is the tree before it here; every iteration is also compared with the reference (default: the
# first of the order). A data root that holds the reference and the trees after it would read
# order = ["d4c2dda", "r1", "r1b", "r2", "main"].
[iterations]
order = ["d4c2dda", "71690ab"]
# reference = "d4c2dda"

# External inputs a family reads that are not in the data root's areas (family D: the atlas project's checkout and its
# per-feature locus tables, for regenerating D's sets; the copies D read are in <families>/d/inputs/, docs/families/d.md).
[sources]
# rosetta = "<a checkout of the atlas project>"
# rosetta_m02 = "<its per-feature locus tables (m02)>"

[jobs]
# `local` runs every job at once in this process's environment; `slurm` submits it with sbatch.
runner = "local"
name_prefix = "idtrack_repro_"
# The Python of this package in jobs (default: the Python that submits them).
# python = "<prefix>/bin/python"
[jobs.slurm]
partition = "cpu_p"
qos = "cpu_normal"
extra = []
# Memory (GB) of a job that holds a graph of the reference tree and asks it, per organism. The defaults below are a wide
# bound; set them to the measured peak of such a job plus a quarter: the query shards of d4c2dda peaked at 3.5 (pig),
# 4.6 (mouse), 4.8 (human), 3.7 (rhesus) and 3.2 GB (cynomolgus), the scheduler's peaks (docs/modest.md, "Size"),
# so 5, 6, 6, 5 and 4.
[jobs.memory_gb]
homo_sapiens = 90
mus_musculus = 50
sus_scrofa = 24
macaca_mulatta = 24
macaca_fascicularis = 20
# Memory (GB) of one job of the modest set (one organism, its parts one after another): the largest measured peak of its
# parts plus a quarter (docs/modest.md, "Size"; defaults in idtrack_reproducibility.config.MODEST_MEMORY_GB).
[jobs.modest_memory_gb]
homo_sapiens = 8
mus_musculus = 7
sus_scrofa = 5
macaca_mulatta = 5
macaca_fascicularis = 4
# Limits per user that `idtrack-repro iterate` reads against the queue (squeue) before each submission: the jobs at
# once (running and pending, these included) and the memory they ask; `names` counts only the jobs whose names start
# so (default: every job of the user). Unset, nothing is held.
[jobs.limits]
# max_jobs = 30
# max_memory_gb = 300
# names = "idtrack_"

[tools]
# The idtrack-web command for family E's web-layer checks (E9).
idtrack_web = "idtrack-web"
